<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>✦ Gem Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap');
:root{
  --teal1:#9ed8d4;--teal2:#b0e4e0;--teal3:#c4f0ec;
  --ink:#021212;--dark:#051818;--mid:#0d4444;--soft:#1a6060;
  --accent:#2a9090;--accent2:#40b8b0;--white:#fff;
  --glass:rgba(255,255,255,0.38);--glass2:rgba(255,255,255,0.6);
  --border:rgba(42,144,144,0.3);--border2:rgba(120,200,196,0.5);
  --red:#a03050;--redbg:rgba(255,210,210,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:#9ed8d4;}
html,body{color:var(--dark);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body{background:linear-gradient(160deg,#9ed8d4 0%,#b0e4e0 30%,#c4f0ec 60%,#9ed4d0 100%);background-attachment:fixed;}

#bg{position:fixed;inset:0;pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 12px 100px;}

header{text-align:center;padding:36px 0 20px;}
header h1{font-family:'Cinzel',serif;font-size:clamp(1.5rem,5vw,2.6rem);font-weight:900;letter-spacing:.08em;background:linear-gradient(135deg,#1a6a60,#40b8a8,#0a8080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
header p{margin-top:5px;font-size:.88rem;font-style:italic;color:var(--mid);}
#gem-count{display:inline-block;margin-top:10px;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.14em;color:var(--soft);border:1px solid rgba(26,106,96,.4);border-radius:20px;padding:3px 13px;}

#nav-tabs{display:flex;gap:0;justify-content:center;margin:18px 0 0;border-bottom:1px solid var(--border2);}
.nav-tab{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.12em;padding:9px 18px;border:none;background:none;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;touch-action:manipulation;}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.nav-tab:hover{color:var(--accent2);}

#toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 14px;}
.tb-btn{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.1em;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--glass);color:var(--dark);cursor:pointer;user-select:none;backdrop-filter:blur(6px);transition:all .2s;touch-action:manipulation;}
.tb-btn:hover{background:var(--glass2);border-color:var(--accent2);}
.tb-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent2);color:#fff;}
.tb-btn.primary:hover{opacity:.9;}
.tb-btn.active-view{background:var(--glass2);border-color:var(--accent);color:var(--accent);font-weight:600;}

#search-wrap{margin:0 0 14px;position:relative;}
#search{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:10px 14px 10px 36px;color:var(--dark);font-family:'Crimson Pro',serif;font-size:16px;outline:none;backdrop-filter:blur(6px);}
#search::placeholder{color:rgba(10,50,50,.5);}
#search-wrap::before{content:'✦';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:.75rem;}

#cabinet-bar{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;margin-bottom:6px;scrollbar-width:none;}
#cabinet-bar::-webkit-scrollbar{display:none;}
.cab-chip{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.1em;padding:5px 12px;border-radius:14px;border:1px solid var(--border2);background:var(--glass);color:var(--mid);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s;touch-action:manipulation;}
.cab-chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent2);color:#fff;}

.group-hd{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.18em;color:var(--soft);padding:16px 4px 7px;border-bottom:1px solid rgba(26,106,96,.25);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.group-hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(26,106,96,.25),transparent);}

#view-grid{display:block;}
.gem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
@media(min-width:500px){.gem-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:720px){.gem-grid{grid-template-columns:repeat(4,1fr);}}
.gem-tile{background:var(--glass);border:1px solid var(--border2);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);transition:transform .2s,box-shadow .2s;}
.gem-tile:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(42,144,144,.15);}
.tile-img{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:rgba(160,220,216,0.25);cursor:pointer;}
.tile-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
.tile-img img.rot{transform:rotate(90deg) scale(1.35);}
.no-photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;background:radial-gradient(circle at 50% 60%,rgba(42,144,144,.12),transparent 70%);}
.rot-btn{position:absolute;bottom:5px;right:5px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--glass2);color:var(--mid);font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;user-select:none;touch-action:manipulation;}
.rot-btn.on{background:rgba(42,160,155,.8);border-color:var(--accent2);color:#fff;}
.cab-badge-wrap{position:absolute;top:5px;left:5px;right:34px;display:flex;flex-wrap:wrap;gap:3px;}
.cab-badge{font-family:'Cinzel',serif;font-size:.46rem;letter-spacing:.05em;background:rgba(42,144,144,.8);color:#fff;padding:2px 6px;border-radius:8px;backdrop-filter:blur(4px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tile-info{padding:7px 8px 8px;}
.tile-name{font-family:'Cinzel',serif;font-size:.64rem;font-weight:600;color:var(--ink);letter-spacing:.04em;line-height:1.3;margin-bottom:1px;}
.tile-sub{font-size:.7rem;font-style:italic;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-meta{font-family:'Cinzel',serif;font-size:.52rem;color:rgba(10,50,50,.55);margin-top:2px;}
.tile-acts{display:flex;gap:4px;margin-top:5px;}
.tile-act{flex:1;font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.05em;padding:5px 2px;border-radius:5px;border:1px solid var(--border);background:var(--glass);color:var(--mid);cursor:pointer;text-align:center;user-select:none;touch-action:manipulation;}
.tile-act.del{border-color:rgba(160,48,80,.3);background:var(--redbg);color:var(--red);}

#view-list{display:none;}
.list-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.list-table th{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;color:var(--soft);padding:8px 10px;border-bottom:1px solid var(--border2);text-align:left;background:var(--glass);position:sticky;top:0;backdrop-filter:blur(8px);}
.list-table td{padding:8px 10px;border-bottom:1px solid rgba(42,144,144,.12);vertical-align:middle;color:var(--dark);}
.list-table tr:hover td{background:rgba(255,255,255,.25);}
.list-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;display:block;cursor:pointer;}
.list-thumb-empty{width:36px;height:36px;border-radius:6px;background:rgba(42,144,144,.12);display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.list-name{font-family:'Cinzel',serif;font-size:.7rem;font-weight:600;color:var(--ink);letter-spacing:.03em;cursor:pointer;}
.list-name:hover{color:var(--accent);}
.list-cabchips{display:flex;flex-wrap:wrap;gap:3px;}
.list-cabchip{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.04em;background:rgba(42,144,144,.15);color:var(--soft);padding:2px 6px;border-radius:6px;white-space:nowrap;}
.list-acts{display:flex;gap:4px;}
.list-act{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.05em;padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--glass);color:var(--mid);cursor:pointer;touch-action:manipulation;}
.list-act.del{border-color:rgba(160,48,80,.3);background:var(--redbg);color:var(--red);}
.list-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border2);background:var(--glass);backdrop-filter:blur(8px);}

#view-cabinets{display:none;}
.cab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(min-width:500px){.cab-grid{grid-template-columns:repeat(3,1fr);}}
.cab-card{background:var(--glass);border:1px solid var(--border2);border-radius:12px;padding:14px;backdrop-filter:blur(8px);cursor:pointer;transition:all .2s;}
.cab-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(42,144,144,.15);}
.cab-icon{font-size:1.6rem;margin-bottom:6px;}
.cab-name{font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;color:var(--ink);letter-spacing:.04em;margin-bottom:2px;}
.cab-loc{font-size:.72rem;font-style:italic;color:var(--mid);}
.cab-count{font-family:'Cinzel',serif;font-size:.58rem;color:var(--soft);margin-top:6px;}
.cab-acts{display:flex;gap:4px;margin-top:8px;}
.cab-act{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.05em;padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--glass2);color:var(--mid);cursor:pointer;touch-action:manipulation;}
.cab-act.del{border-color:rgba(160,48,80,.3);background:var(--redbg);color:var(--red);}
.add-cab-card{background:rgba(42,144,144,.08);border:1px dashed var(--border2);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:100px;transition:all .2s;}
.add-cab-card:hover{background:rgba(42,144,144,.15);}
.add-cab-label{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;color:var(--soft);margin-top:4px;}

#lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(2,18,18,.92);backdrop-filter:blur(12px);flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:hidden;}
#lightbox.open{display:flex;}
#lb-inner{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;}
/* ── Photo zone ── */
#lb-photo-zone{position:relative;width:100%;flex:0 0 55vh;background:#021212;overflow:hidden;touch-action:none;}
#lb-img-wrap{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#lb-img{display:block;max-width:none;max-height:none;transform-origin:center center;user-select:none;-webkit-user-drag:none;pointer-events:none;}
#lb-img.rot{transform:rotate(90deg);}
#lb-nophoto{width:100%;height:100%;display:none;align-items:center;justify-content:center;font-size:5rem;}
#lb-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(120,200,196,.4);background:rgba(2,18,18,.7);color:rgba(200,240,236,.9);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;touch-action:manipulation;backdrop-filter:blur(6px);}
#lb-rot-btn{position:absolute;bottom:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(120,200,196,.4);background:rgba(2,18,18,.7);color:rgba(200,240,236,.9);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;touch-action:manipulation;backdrop-filter:blur(6px);}
#lb-zoom-hint{position:absolute;bottom:12px;left:12px;font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.08em;color:rgba(180,230,226,.5);pointer-events:none;opacity:1;transition:opacity 1s;}
#lb-zoom-hint.hidden{opacity:0;}
/* ── Detail scroll zone ── */
#lb-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 30px;background:linear-gradient(180deg,rgba(2,18,18,0) 0%,rgba(4,28,28,.95) 18px,rgba(4,28,28,.98) 100%);}
#lb-name{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;color:#e8f8f6;letter-spacing:.05em;margin-bottom:3px;line-height:1.3;}
#lb-meta{font-size:.82rem;font-style:italic;color:var(--accent2);margin-bottom:14px;}
#lb-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:12px;}
.lb-field{display:flex;flex-direction:column;gap:2px;}
.lb-field.full{grid-column:1/-1;}
.lb-field-label{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.14em;color:var(--accent2);opacity:.8;}
.lb-field-val{font-size:.88rem;color:#d8f0ee;line-height:1.4;}
.lb-cabchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;}
.lb-cabchip{font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.05em;background:rgba(42,144,144,.2);color:var(--accent2);padding:3px 9px;border-radius:8px;border:1px solid rgba(42,144,144,.3);}
#lb-notes{font-size:.86rem;line-height:1.7;color:#c8e8e4;border-top:1px solid rgba(42,144,144,.2);padding-top:10px;margin-top:6px;}
#lb-actions{display:flex;gap:8px;margin-top:14px;}
.lb-act{flex:1;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.08em;padding:11px;border-radius:8px;border:1px solid rgba(42,144,144,.3);background:rgba(42,144,144,.08);color:var(--accent2);cursor:pointer;text-align:center;touch-action:manipulation;}
.lb-act.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent2);color:#fff;}
.lb-act.del{border-color:rgba(160,48,80,.3);background:rgba(160,48,80,.08);color:#d06080;}

.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(100,180,176,.35);backdrop-filter:blur(8px);align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px 12px 40px;}
.modal.open{display:flex;}
.mbox{width:100%;max-width:460px;margin:auto;background:var(--glass2);border:1px solid var(--border2);border-radius:18px;padding:20px 18px 24px;backdrop-filter:blur(14px);}
.mbox h2{font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:.12em;color:var(--soft);margin-bottom:14px;text-align:center;}
.field{margin-bottom:10px;}
.field label{display:block;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.1em;color:var(--soft);margin-bottom:3px;}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--ink);font-family:'Crimson Pro',serif;font-size:16px;outline:none;-webkit-appearance:none;}
.field select{cursor:pointer;}
.field textarea{resize:vertical;min-height:60px;line-height:1.5;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#photo-prev{width:100%;max-height:140px;object-fit:cover;border-radius:7px;border:1px solid var(--border);display:none;margin-top:6px;}
#ferr{display:none;background:var(--redbg);border:1px solid rgba(160,48,80,.4);border-radius:7px;padding:8px 11px;font-size:.82rem;color:#7a1830;margin-top:10px;line-height:1.5;}
#ferr.show{display:block;}
.form-acts{display:flex;gap:8px;margin-top:14px;}
.form-acts button{flex:1;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;padding:13px;border-radius:8px;border:none;cursor:pointer;user-select:none;min-height:46px;touch-action:manipulation;}
#btn-cancel{background:var(--glass);border:1px solid var(--border);color:var(--dark);}
#btn-save{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}

/* ── CABINET MULTI-SELECT — plain <button> rows, same pattern as the working cabinet filter chips ── */
#f-cabinets-wrap{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.4);border:1px solid var(--border);border-radius:7px;padding:4px;}
.cab-check-row{display:flex;align-items:center;gap:10px;width:100%;font-family:'Crimson Pro',serif;font-size:.92rem;color:var(--ink);cursor:pointer;padding:10px 8px;border-radius:5px;-webkit-tap-highlight-color:rgba(42,144,144,0.25);touch-action:manipulation;transition:background 0.1s;background:none;border:none;text-align:left;}
.cab-check-row:active{background:rgba(42,144,144,0.18);}
.cab-check-box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#fff;}
.cab-check-row.on .cab-check-box{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent2);}
.cab-check-empty{font-size:.82rem;font-style:italic;color:var(--mid);padding:8px;}

/* ── PURCHASE MATCH SEARCH ── */
#f-purch-results,#bf-purch-results{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.purchase-row{display:block;width:100%;text-align:left;font-family:'Crimson Pro',serif;font-size:.82rem;color:var(--ink);background:rgba(255,255,255,.5);border:1px solid var(--border);border-radius:6px;padding:9px 10px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(42,144,144,0.25);}
.purchase-row:active{background:rgba(42,144,144,0.18);}
.purchase-clear{margin-top:6px;font-family:'Cinzel',serif;font-size:.56rem;letter-spacing:.08em;color:var(--soft);background:none;border:none;text-decoration:underline;cursor:pointer;padding:4px 0;touch-action:manipulation;}
.purchase-status{font-family:'Crimson Pro',serif;font-size:.74rem;font-style:italic;color:var(--mid);margin-top:5px;}

#cab-modal .mbox{max-width:360px;}
#cab-ferr{display:none;background:var(--redbg);border:1px solid rgba(160,48,80,.4);border-radius:7px;padding:8px 11px;font-size:.82rem;color:#7a1830;margin-top:10px;}
#cab-ferr.show{display:block;}
#cab-form-acts{display:flex;gap:8px;margin-top:14px;}
#cab-form-acts button{flex:1;font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.1em;padding:12px;border-radius:8px;cursor:pointer;min-height:44px;touch-action:manipulation;}
#cab-btn-cancel{background:var(--glass);border:1px solid var(--border);color:var(--dark);}
#cab-btn-save{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;}

#del-modal{z-index:300;}
#del-modal .mbox{max-width:300px;text-align:center;border-color:rgba(160,48,80,.4);}
#del-modal h2{color:var(--red);}
#del-gem-name{font-family:'Cinzel',serif;font-size:.88rem;color:var(--ink);margin-bottom:8px;}
#del-note{font-size:.82rem;font-style:italic;color:var(--mid);margin-bottom:16px;line-height:1.5;}
#del-acts{display:flex;gap:8px;}
#del-acts button{flex:1;font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.08em;padding:12px;border-radius:8px;cursor:pointer;min-height:44px;touch-action:manipulation;}
#btn-del-no{background:var(--glass);border:1px solid var(--border);color:var(--dark);}
#btn-del-yes{background:linear-gradient(135deg,#b02840,#d04060);border:none;color:#fff;}

#empty{display:none;text-align:center;padding:50px 20px;}
#empty p{font-size:.95rem;font-style:italic;color:var(--mid);}

#bulk-progress{text-align:center;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;color:var(--soft);margin-bottom:10px;}
#bulk-photo-prev{width:100%;height:180px;object-fit:cover;border-radius:9px;border:1px solid var(--border2);display:none;margin-bottom:12px;background:rgba(160,220,216,.2);}
#bulk-ferr{display:none;background:var(--redbg);border:1px solid rgba(160,48,80,.4);border-radius:7px;padding:8px 11px;font-size:.82rem;color:#7a1830;margin-top:6px;line-height:1.5;}
#bulk-ferr.show{display:block;}
#bulk-modal .mbox{max-width:460px;}
#bulk-acts{display:flex;gap:8px;margin-top:14px;}
#bulk-acts button{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.08em;padding:12px 4px;border-radius:8px;border:none;cursor:pointer;min-height:46px;touch-action:manipulation;}
#bulk-cancel{background:var(--glass);border:1px solid var(--border);color:var(--dark);flex:0.7;}
#bulk-skip{background:var(--glass2);border:1px solid var(--border2);color:var(--mid);flex:0.8;}
#bulk-save{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:1.3;}

#saved-flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(200,240,210,.95);border:1px solid #60b870;color:#1a4a28;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;padding:8px 18px;border-radius:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#saved-flash.show{opacity:1;}
#db-status{text-align:center;font-size:.68rem;color:var(--soft);padding:4px;font-style:italic;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="saved-flash">✦ Saved</div>

<!-- ADD/EDIT MODAL -->
<div id="add-modal" class="modal">
  <div class="mbox">
    <h2 id="form-title">✦ ADD NEW GEM ✦</h2>
    <div class="field"><label for="f-purch-search">MATCH A PURCHASE (optional — type a gemstone or origin)</label>
      <input id="f-purch-search" type="text" placeholder="e.g. fluorite madagascar" autocomplete="off" autocorrect="off">
      <div id="f-purch-results"></div>
      <div id="f-purch-status" class="purchase-status"></div>
    </div>
    <div class="field"><label>GEM ID</label><input id="f-id" type="text" placeholder="gem-001"></div>
    <div class="field"><label>NAME</label><input id="f-name" type="text" placeholder="Amethyst Cluster"></div>
    <div class="field-row">
      <div class="field"><label>MINERAL GROUP</label><input id="f-group" type="text" placeholder="Quartz" list="grp-list"><datalist id="grp-list"></datalist></div>

    </div>
    <div class="field-row">
      <div class="field"><label>COUNTRY</label><input id="f-origin" type="text" placeholder="Brazil"></div>
      <div class="field"><label>LOCATION / MINE</label><input id="f-location" type="text" placeholder="Minas Gerais"></div>
    </div>
    <div class="field"><label>PROVENANCE (from whom)</label><input id="f-prov" type="text" placeholder="Purchased at Tucson Gem Show 2024"></div>
    <div class="field"><label>CABINETS (select any that apply)</label>
      <div id="f-cabinets-wrap"></div>
    </div>
    <div class="field"><label>NOTES</label><textarea id="f-notes" placeholder="Description, size, characteristics…"></textarea></div>
    <div class="field"><label>PHOTO</label><input id="f-photo" type="file" accept="image/*"><img id="photo-prev" alt="preview"></div>
    <div id="ferr"></div>
    <div class="form-acts">
      <button id="btn-cancel">Cancel</button>
      <button id="btn-save">Add to Collection</button>
    </div>
  </div>
</div>

<script>
// ── IndexedDB ──────────────────────────────────────────────────────────────
var DB_NAME='GemGallery', DB_VER=2, db=null;
var gems=[], imgs={}, cabinets=[], rotated={};
var editId=null, delId=null, delType=null, pendingPhoto=null, editCabId=null;
var currentView='grid', currentTab='collection', filterCabinet='all';

// ── PURCHASE MATCH (from purchase history) ──────────────────────────────────
var PURCHASES=[];
var currentPurchMatches=[];

function parsePurchases(){
  var el=document.getElementById('purchase-data');
  if(!el)return [];
  var lines=el.textContent.split('\n');
  var out=[];
  for(var i=1;i<lines.length;i++){
    var line=lines[i];
    if(!line||!line.trim())continue;
    var c=line.split('\t');
    var p={vendor:(c[0]||'').trim(),invoice:(c[1]||'').trim(),date:(c[2]||'').trim(),
           item:(c[3]||'').trim(),qty:(c[4]||'').trim(),price:(c[5]||'').trim(),
           type:(c[6]||'').trim(),gem:(c[7]||'').trim(),origin:(c[8]||'').trim(),
           src:(c[9]||'').trim(),month:(c[10]||'').trim(),flag:(c[11]||'').trim()};
    if(!p.gem && !p.item)continue;
    out.push(p);
  }
  return out;
}

function cleanItemName(item){
  var s=String(item||'');
  s=s.replace(/\s*\([^)]*\)\s*$/,''); // strip trailing parenthetical origin
  s=s.replace(/,\s*$/,'');
  s=s.replace(/\s*-\s*$/,'');
  return s.trim();
}

var PURCHASE_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSOTWPZlNWNm_SLqhDH9d4-NEF4zBatjrNXiMmPkmybnh8rUnK5R2kjcSIxd_CLwDMj-Bvp_Z3HqW4y/pub?gid=306141163&single=true&output=csv';

function parseCSV(text){
  var rows=[],row=[],field='',inQuotes=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else{inQuotes=false;} }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===',') {row.push(field);field='';}
      else if(c==='\r') {/*skip*/}
      else if(c==='\n') {row.push(field);rows.push(row);row=[];field='';}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}

function rowsToPurchases(rows){
  if(!rows.length)return [];
  var header=rows[0].map(function(h){return String(h||'').trim().toLowerCase();});
  function idx(){
    for(var a=0;a<arguments.length;a++){var i=header.indexOf(arguments[a]);if(i>-1)return i;}
    return -1;
  }
  var iVendor=idx('vendor');
  var iInvoice=idx('invoice #','invoice');
  var iDate=idx('purchase date','date');
  var iItem=idx('item');
  var iQty=idx('qty');
  var iPrice=idx('line total','unit price','price');
  var iType=idx('type');
  var iGem=idx('gemstone','gem');
  var iOrigin=idx('region/origin','origin');
  var out=[];
  for(var r=1;r<rows.length;r++){
    var c=rows[r];
    if(!c||!c.length)continue;
    var item=(c[iItem]||'').trim();
    var gem=(c[iGem]||'').trim();
    if(!item && !gem)continue;
    out.push({
      vendor:(c[iVendor]||'').trim(), invoice:(c[iInvoice]||'').trim(), date:(c[iDate]||'').trim(),
      item:item, qty:(c[iQty]||'').trim(), price:(c[iPrice]||'').trim(),
      type:(c[iType]||'').trim(), gem:gem, origin:(c[iOrigin]||'').trim()
    });
  }
  return out;
}

function filterPurchases(list){
  return list.filter(function(p){
    var text=(p.item+' '+p.gem).toLowerCase();
    if(text.indexOf('sphere')>-1)return false;
    if(text.indexOf('bracelet')>-1)return false;
    if(p.type.toLowerCase()==='decor')return false;
    return true;
  });
}

function setPurchStatus(msg){
  ['f-purch-status','bf-purch-status'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.textContent=msg;
  });
}

function loadPurchasesLive(){
  setPurchStatus('Checking for the latest purchases…');
  fetch(PURCHASE_CSV_URL,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('bad status');
    return r.text();
  }).then(function(text){
    var list=filterPurchases(rowsToPurchases(parseCSV(text)));
    if(!list.length)throw new Error('empty');
    PURCHASES=list;
    setPurchStatus(list.length+' purchases synced ✓');
  }).catch(function(){
    setPurchStatus('Using saved copy (offline)');
  });
}

var PURCH_FIELD_MAP={
  single:{name:'f-name',group:'f-group',origin:'f-origin',location:'f-location',prov:'f-prov'},
  bulk:{name:'bf-name',group:'bf-group',origin:'bf-origin',location:'bf-location',prov:'bf-prov'}
};

function fillFromPurchase(p, mode){
  var m=PURCH_FIELD_MAP[mode];
  var nameEl=document.getElementById(m.name);
  if(nameEl) nameEl.value=cleanItemName(p.item)||p.gem||'';
  var groupEl=document.getElementById(m.group);
  if(groupEl) groupEl.value=p.gem||'';
  var originEl=document.getElementById(m.origin);
  if(originEl) originEl.value=(p.origin && p.origin.toLowerCase()!=='unknown')?p.origin:'';
  var provParts=[];
  if(p.vendor) provParts.push(p.vendor);
  if(p.invoice && p.invoice.toLowerCase().indexOf('manual')!==0) provParts.push('Inv #'+p.invoice);
  if(p.date) provParts.push(p.date);
  var provEl=document.getElementById(m.prov);
  if(provEl && provParts.length) provEl.value=provParts.join(' · ');
}

function wirePurchaseSearch(searchId, resultsId, mode){
  var input=document.getElementById(searchId);
  var box=document.getElementById(resultsId);
  if(!input||!box)return;

  var localMatches=[];

  function doSearch(){
    var q=input.value.trim().toLowerCase();
    if(q.length<1){
      // Small delay before clearing — prevents accidental clear when tapping a result
      setTimeout(function(){if(input.value.trim().length<1){box.innerHTML='';localMatches=[];}},200);
      return;
    }
    localMatches=PURCHASES.filter(function(p){
      return (p.gem+' '+p.origin+' '+p.item+' '+p.vendor).toLowerCase().indexOf(q)>-1;
    }).slice(0,12);
    if(!localMatches.length){
      box.innerHTML='<div style="font-size:.82rem;font-style:italic;color:var(--mid);padding:6px 0;">No matches</div>';
      return;
    }
    box.innerHTML='';
    localMatches.forEach(function(p,i){
      var nm=p.gem||cleanItemName(p.item)||'?';
      var org=(p.origin&&p.origin.toLowerCase()!=='unknown')?p.origin:'';
      var who=p.vendor||'';
      var pr=p.price||'';
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='purchase-row';
      btn.textContent=nm+(org?' — '+org:'')+(pr?' · '+pr:'')+(who?' · '+who:'');
      (function(match){
        btn.addEventListener('click',function(){
          fillFromPurchase(match, mode);
          box.innerHTML='';
          input.value='';
          flashSaved();
        });
      })(p);
      box.appendChild(btn);
    });
  }

  input.addEventListener('input', doSearch);
  // prevent results from disappearing when user scrolls/taps inside the results box
  box.addEventListener('touchstart', function(ev){ev.stopPropagation();},{passive:true});
}

function openDB(cb){
  var req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=function(e){
    var d=e.target.result;
    if(!d.objectStoreNames.contains('gems')) d.createObjectStore('gems',{keyPath:'id'});
    if(!d.objectStoreNames.contains('imgs')) d.createObjectStore('imgs',{keyPath:'id'});
    if(!d.objectStoreNames.contains('cabinets')) d.createObjectStore('cabinets',{keyPath:'id',autoIncrement:true});
  };
  req.onsuccess=function(e){db=e.target.result;cb();};
  req.onerror=function(){document.getElementById('db-status').textContent='';render('');};
}

function loadAll(cb){
  var tx=db.transaction(['gems','imgs','cabinets'],'readonly');
  var gr=tx.objectStore('gems').getAll();
  var ir=tx.objectStore('imgs').getAll();
  var cr=tx.objectStore('cabinets').getAll();
  var done=0;
  function chk(){if(++done===3)cb();}
  gr.onsuccess=function(){
    gems=gr.result||[];
    // migrate legacy single 'cabinet' field to 'cabinets' array
    gems.forEach(function(g){
      if(g.cabinets===undefined){
        g.cabinets = g.cabinet ? [g.cabinet] : [];
      }
    });
    chk();
  };
  ir.onsuccess=function(){imgs={};(ir.result||[]).forEach(function(r){imgs[r.id]=r.data;});chk();};
  cr.onsuccess=function(){cabinets=cr.result||[];chk();};
}

function persistGem(g,cb){var tx=db.transaction('gems','readwrite');tx.objectStore('gems').put(g);tx.oncomplete=function(){if(cb)cb();};}
function persistImg(id,data,cb){var tx=db.transaction('imgs','readwrite');tx.objectStore('imgs').put({id:id,data:data});tx.oncomplete=function(){if(cb)cb();};}
function persistCab(c,cb){var tx=db.transaction('cabinets','readwrite');var req=tx.objectStore('cabinets').put(c);req.onsuccess=function(){if(!c.id)c.id=req.result;};tx.oncomplete=function(){if(cb)cb();};}
function deleteGemDB(id,cb){var tx=db.transaction(['gems','imgs'],'readwrite');tx.objectStore('gems').delete(id);tx.objectStore('imgs').delete(id);tx.oncomplete=function(){if(cb)cb();};}
function deleteCabDB(id,cb){var tx=db.transaction('cabinets','readwrite');tx.objectStore('cabinets').delete(id);tx.oncomplete=function(){if(cb)cb();};}

// ── Glitter Stars ──────────────────────────────────────────────────────────
(function(){
  var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,stars=[];
  var COLORS=['#ffffff','#80d8d0','#40b0a8','#a0e8e4','#c0f4f0','#60c8c0','#e0f8f6','#90d4d0','#b0ece8'];
  function sz(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  sz();window.addEventListener('resize',function(){sz();mkStars();});
  function mkStars(){stars=[];for(var i=0;i<280;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+0.6,speed:Math.random()*.003+.001,phase:Math.random()*Math.PI*2,color:COLORS[Math.floor(Math.random()*COLORS.length)],sparkle:Math.random()>.55});}
  mkStars();
  function dsp(ctx,sx,sy,r,alpha,col){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=r*.6;ctx.beginPath();for(var i=0;i<4;i++){var a=(i/4)*Math.PI*2;ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*r*2.5,sy+Math.sin(a)*r*2.5);}ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx,sy,r*.5,0,Math.PI*2);ctx.fill();ctx.restore();}
  var t=0;
  (function draw(){x.clearRect(0,0,W,H);t+=1;for(var i=0;i<stars.length;i++){var s=stars[i];var alpha=.3+.7*Math.abs(Math.sin(t*s.speed+s.phase));if(s.sparkle)dsp(x,s.x,s.y,s.r,alpha*.9,s.color);else{x.save();x.globalAlpha=alpha;x.fillStyle=s.color;x.shadowColor=s.color;x.shadowBlur=s.r*3;x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();x.restore();}}requestAnimationFrame(draw);})();
})();

function gemCabinets(g){
  // returns array of cabinet ids for a gem (handles legacy + new)
  if(Array.isArray(g.cabinets))return g.cabinets;
  if(g.cabinet)return [g.cabinet];
  return [];
}

function getCabName(id){
  var c=cabinets.find(function(x){return x.id===id;});
  return c?c.name:'';
}

function getCabNames(g){
  return gemCabinets(g).map(getCabName).filter(Boolean);
}

// ── Filter gems ────────────────────────────────────────────────────────────
function filterGems(q){
  var list=gems.slice();
  if(q){var ql=q.toLowerCase();list=list.filter(function(g){return (g.name+' '+g.group+' '+g.origin+' '+g.notes+' '+g.id+' '+(g.formula||'')+' '+(g.prov||'')+' '+(g.location||'')).toLowerCase().indexOf(ql)>-1;});}
  if(filterCabinet==='none') list=list.filter(function(g){return gemCabinets(g).length===0;});
  else if(filterCabinet!=='all') list=list.filter(function(g){return gemCabinets(g).indexOf(filterCabinet)>-1;});
  return list;
}

// ── LIGHTBOX — full screen photo + pinch/pan + detail scroll ───────────────
var lbZoom=1, lbPanX=0, lbPanY=0, lbRotDeg=0;
var lbTouchState=null;

function lbApplyTransform(){
  var img=document.getElementById('lb-img');
  img.style.transform='rotate('+lbRotDeg+'deg) scale('+lbZoom+') translate('+lbPanX+'px,'+lbPanY+'px)';
}

function lbResetTransform(){
  lbZoom=1;lbPanX=0;lbPanY=0;
  lbApplyTransform();
}

function openLB(id){

    li.src=imgs[g.photo];
    li.style.display='block';
    li.style.width='100%';
    li.style.height='100%';
    li.style.objectFit='contain';
    li.style.transformOrigin='center center';
    ln.style.display='none';
    lbApplyTransform();
  } else {
    li.style.display='none';
    ln.style.display='flex';
  }

  // populate details
  document.getElementById('lb-name').textContent=g.name||'';
  var meta=(g.group||'')+(g.formula?' · '+g.formula:'');
  document.getElementById('lb-meta').textContent=meta;
  var fields=[];
  if(g.origin||g.location) fields.push({l:'Origin',v:(g.origin||'')+(g.location?' — '+g.location:'')});
  if(g.prov) fields.push({l:'Provenance',v:g.prov});
  if(g.id) fields.push({l:'ID',v:g.id});
  var fh=fields.map(function(f){return '<div class="lb-field"><div class="lb-field-label">'+e(f.l)+'</div><div class="lb-field-val">'+e(f.v)+'</div></div>';}).join('');
  var cabNames=getCabNames(g);
  if(cabNames.length){
    fh+='<div class="lb-field full"><div class="lb-field-label">Cabinets</div><div class="lb-cabchips">'+cabNames.map(function(n){return '<span class="lb-cabchip">'+e(n)+'</span>';}).join('')+'</div></div>';
  }
  document.getElementById('lb-fields').innerHTML=fh;
  document.getElementById('lb-notes').innerHTML=g.notes?e(g.notes):'';
  document.getElementById('lb-notes').style.display=g.notes?'block':'none';
  document.getElementById('lb-actions').innerHTML=
    '<button class="lb-act primary lbedit" data-id="'+e(id)+'">✎ Edit</button>'+
    '<button class="lb-act del lbdel" data-id="'+e(id)+'">✕ Delete</button>';
  document.getElementById('lb-actions').onclick=function(ev){
    var t=ev.target;
    if(t.classList.contains('lbedit')){closeLB();openEdit(t.getAttribute('data-id'));return;}
    if(t.classList.contains('lbdel')){closeLB();openDel(t.getAttribute('data-id'),'gem');return;}
  };

  // rotate button
  document.getElementById('lb-rot-btn').onclick=function(){
    lbRotDeg=(lbRotDeg+90)%360;
    rotated[id]=(lbRotDeg!==0);
    lbResetTransform();
    // also update tile
    var tileImg=document.querySelector('.tile-img[data-id="'+id+'"] .tile-photo');
    var tileBtn=document.querySelector('.rot-btn[data-rid="'+id+'"]');
    if(tileImg){rotated[id]?tileImg.classList.add('rot'):tileImg.classList.remove('rot');}
    if(tileBtn){rotated[id]?tileBtn.classList.add('on'):tileBtn.classList.remove('on');}
  };

  // show hint briefly
  var hint=document.getElementById('lb-zoom-hint');
  hint.classList.remove('hidden');
  clearTimeout(openLB._ht);
  openLB._ht=setTimeout(function(){hint.classList.add('hidden');},2200);

  document.getElementById('lightbox').classList.add('open');
  document.getElementById('lb-body').scrollTop=0;

  // wire touch gestures on photo zone
  lbWireTouch();
}

function lbWireTouch(){
  var zone=document.getElementById('lb-photo-zone');
  // remove old listeners by cloning
  var fresh=zone.cloneNode(true);
  zone.parentNode.replaceChild(fresh,zone);
  // re-attach buttons
  document.getElementById('lb-close').onclick=closeLB;
  document.getElementById('lb-rot-btn').onclick=document.getElementById('lb-rot-btn').onclick; // preserved above

  var startTouches=null, startZoom=1, startPan={x:0,y:0}, lastDist=0, lastMid={x:0,y:0};

  fresh.addEventListener('touchstart',function(ev){
    if(ev.touches.length===1){
      startTouches=ev.touches;
      startZoom=lbZoom;
      startPan={x:lbPanX,y:lbPanY};
      lastDist=0;
    } else if(ev.touches.length===2){
      var t0=ev.touches[0],t1=ev.touches[1];
      lastDist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
      lastMid={x:(t0.clientX+t1.clientX)/2,y:(t0.clientY+t1.clientY)/2};
      startZoom=lbZoom;
      startPan={x:lbPanX,y:lbPanY};
    }
  },{passive:true});

  fresh.addEventListener('touchmove',function(ev){
    ev.preventDefault();
    if(ev.touches.length===2){
      var t0=ev.touches[0],t1=ev.touches[1];
      var dist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
      if(lastDist){
        var scale=dist/lastDist;
        lbZoom=Math.max(1,Math.min(6,startZoom*scale));
      }
      lbApplyTransform();
    } else if(ev.touches.length===1&&startTouches&&lbZoom>1){
      var dx=ev.touches[0].clientX-startTouches[0].clientX;
      var dy=ev.touches[0].clientY-startTouches[0].clientY;
      lbPanX=startPan.x+dx/lbZoom;
      lbPanY=startPan.y+dy/lbZoom;
      lbApplyTransform();
    }
  },{passive:false});

  fresh.addEventListener('touchend',function(ev){
    if(ev.touches.length===0){
      if(lbZoom<1.05){lbZoom=1;lbPanX=0;lbPanY=0;lbApplyTransform();}
      startTouches=null;
    }
  },{passive:true});

  // double-tap to reset zoom
  var lastTap=0;
  fresh.addEventListener('touchend',function(ev){
    var now=Date.now();
    if(now-lastTap<300){lbZoom=1;lbPanX=0;lbPanY=0;lbApplyTransform();}
    lastTap=now;
  },{passive:true});
}

  document.getElementById('lightbox').classList.remove('open');
  lbResetTransform();
}

function processPhotoFile(file,cb){
  var r=new FileReader();
  r.onload=function(ev){
    var dataURI=ev.target.result;
    r=null; // free FileReader
    var img=new Image();
    img.onload=function(){
      var MAX=800,q=0.70,w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var result=cv.toDataURL('image/jpeg',q);
      // Explicitly release memory before calling back
      img.src='';img.onload=null;
      cv.width=0;cv.height=0;
      // Small yield so browser can GC before next step
      setTimeout(function(){cb(result);},30);
    };
    img.onerror=function(){img.src='';cb(dataURI);};
    img.src=dataURI;
  };
  r.readAsDataURL(file);
}

document.getElementById('f-photo').onchange=function(){
  var f=this.files[0];if(!f)return;
  processPhotoFile(f,function(dataURL){
    pendingPhoto=dataURL;
    var p=document.getElementById('photo-prev');p.src=pendingPhoto;p.style.display='block';
  });
};

var selectedCabIds=[];

function fillCabCheckboxes(selectedIds){
  selectedCabIds=(selectedIds||[]).slice();
  var wrap=document.getElementById('f-cabinets-wrap');
  if(!cabinets.length){
    wrap.innerHTML='<div class="cab-check-empty">No cabinets yet — create one in the Cabinets tab.</div>';
    return;
  }
  renderCabCheckRows();
}

function renderCabCheckRows(){
  var wrap=document.getElementById('f-cabinets-wrap');
  var h='';
  cabinets.forEach(function(c){
    var on=selectedCabIds.indexOf(c.id)>-1;
    h+='<button type="button" class="cab-check-row'+(on?' on':'')+'" data-cid="'+c.id+'"><span class="cab-check-box">'+(on?'✓':'')+'</span>'+e(c.name)+'</button>';
  });
  wrap.innerHTML=h;
  wrap.onclick=function(ev){
    var btn=ev.target.closest('.cab-check-row');
    if(!btn)return;
    var cid=parseInt(btn.getAttribute('data-cid'));
    var idx=selectedCabIds.indexOf(cid);
    if(idx>-1)selectedCabIds.splice(idx,1);else selectedCabIds.push(cid);
    renderCabCheckRows();
  };
}

function getSelectedCabinets(){
  return selectedCabIds.slice();
}

function openAdd(){
  editId=null;pendingPhoto=null;
  document.getElementById('form-title').textContent='✦ ADD NEW GEM ✦';
  document.getElementById('btn-save').textContent='Add to Collection';
  document.getElementById('f-id').readOnly=false;document.getElementById('f-id').style.opacity='1';
  var mx=0;gems.forEach(function(g){var m=(g.id||'').match(/(\d+)$/);if(m)mx=Math.max(mx,+m[1]);});
  document.getElementById('f-id').value='gem-'+pad(mx+1);
  ['f-name','f-group','f-formula','f-origin','f-location','f-prov','f-notes'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-photo').value='';
  document.getElementById('photo-prev').style.display='none';
  fillGrps();fillCabCheckboxes([]);clrErr();
  document.getElementById('add-modal').classList.add('open');
}

function openEdit(id){
  var g=find(id);if(!g)return;
  editId=id;pendingPhoto=null;
  document.getElementById('form-title').textContent='✦ EDIT GEM ✦';
  document.getElementById('btn-save').textContent='Save Changes';
  document.getElementById('f-id').value=g.id;document.getElementById('f-id').readOnly=true;document.getElementById('f-id').style.opacity='.5';
  document.getElementById('f-name').value=g.name||'';
  document.getElementById('f-group').value=g.group||'';
  document.getElementById('f-formula').value=g.formula||'';
  document.getElementById('f-origin').value=g.origin||'';
  document.getElementById('f-location').value=g.location||'';
  document.getElementById('f-prov').value=g.prov||'';
  document.getElementById('f-notes').value=g.notes||'';
  document.getElementById('f-photo').value='';
  var p=document.getElementById('photo-prev'),xi=g.photo?imgs[g.photo]:null;
  if(xi){p.src=xi;p.style.display='block';}else{p.style.display='none';}
  fillGrps();fillCabCheckboxes(gemCabinets(g));clrErr();
  document.getElementById('add-modal').classList.add('open');
}

function closeAdd(){document.getElementById('add-modal').classList.remove('open');editId=null;}

function fillGrps(){
  var g={};gems.forEach(function(x){if(x.group)g[x.group]=1;});
  document.getElementById('grp-list').innerHTML=Object.keys(g).sort().map(function(k){return '<option value="'+e(k)+'">';}).join('');
}

function trySave(){
  clrErr();
  var id=document.getElementById('f-id').value.trim();
  var nm=document.getElementById('f-name').value.trim();
  var gr=document.getElementById('f-group').value.trim();
  var fo=document.getElementById('f-formula').value.trim();
  var or=document.getElementById('f-origin').value.trim();
  var lo=document.getElementById('f-location').value.trim();
  var pv=document.getElementById('f-prov').value.trim();
  var nt=document.getElementById('f-notes').value.trim();
  var cabIds=getSelectedCabinets();
  if(!nm){shErr('Please enter a name.');return;}
  if(editId){
    var i=gems.findIndex(function(x){return x.id===editId;});
    if(i<0){shErr('Gem not found.');return;}
    gems[i].name=nm;gems[i].group=gr||'Uncategorized';gems[i].formula=fo;
    gems[i].origin=or;gems[i].location=lo;gems[i].prov=pv;gems[i].notes=nt;
    gems[i].cabinets=cabIds;
    delete gems[i].cabinet; // drop legacy field
    persistGem(gems[i]);
    if(pendingPhoto){imgs[editId]=pendingPhoto;gems[i].photo=editId;persistImg(editId,pendingPhoto);persistGem(gems[i]);}
    flashSaved();document.getElementById('btn-save').textContent='✓ Saved!';
    setTimeout(function(){closeAdd();render(document.getElementById('search').value);},500);
    return;
  }
  if(!id){shErr('Please enter a Gem ID.');return;}
  if(find(id)){shErr('ID "'+id+'" already exists.');return;}
  var gem={id:id,name:nm,group:gr||'Uncategorized',formula:fo,origin:or,location:lo,prov:pv,notes:nt,photo:pendingPhoto?id:null,cabinets:cabIds};
  gems.push(gem);persistGem(gem);
  if(pendingPhoto){imgs[id]=pendingPhoto;persistImg(id,pendingPhoto);}
  flashSaved();document.getElementById('btn-save').textContent='✓ Added!';
  setTimeout(function(){closeAdd();render(document.getElementById('search').value);},500);
}

// ── CABINETS CRUD ──────────────────────────────────────────────────────────
document.getElementById('btn-add-cab').onclick=openAddCab;
document.getElementById('cab-btn-cancel').onclick=function(){document.getElementById('cab-modal').classList.remove('open');editCabId=null;};
document.getElementById('cab-modal').onclick=function(ev){if(ev.target===this){this.classList.remove('open');editCabId=null;}};
document.getElementById('cab-btn-save').onclick=trySaveCab;

function openAddCab(){
  editCabId=null;
  document.getElementById('cab-form-title').textContent='✦ NEW CABINET ✦';
  document.getElementById('cab-btn-save').textContent='Create Cabinet';
  ['cf-name','cf-loc','cf-desc'].forEach(function(id){document.getElementById(id).value='';});

  document.getElementById('cab-modal').classList.add('open');
}

function openEditCab(id){

function trySaveCab(){
  var nm=document.getElementById('cf-name').value.trim();
  if(!nm){document.getElementById('cab-ferr').textContent='Please enter a cabinet name.';document.getElementById('cab-ferr').classList.add('show');return;}
  var lo=document.getElementById('cf-loc').value.trim();

  flashSaved();document.getElementById('cab-modal').classList.remove('open');editCabId=null;
  setTimeout(function(){renderCabinets();renderCabBar();},200);

// ── BULK ADD ───────────────────────────────────────────────────────────────
var bulkQueue=[], bulkIndex=0, bulkLastMeta=null, bulkPendingPhoto=null, bulkNextPhoto=null, selectedBulkCabIds=[], bulkSaved=0;

document.getElementById('bulk-photo-input').onchange=function(){
  var files=Array.prototype.slice.call(this.files);
  this.value='';
  if(!files.length)return;
  bulkQueue=files;bulkIndex=0;bulkSaved=0;bulkLastMeta=null;bulkNextPhoto=null;
  // Pre-compress first photo, then open
  processPhotoFile(bulkQueue[0],function(dataURL){
    bulkPendingPhoto=dataURL;
    if(bulkQueue.length>1)processPhotoFile(bulkQueue[1],function(d){bulkNextPhoto=d;});
    openBulkStep(true);
  });
};

function bulkNextId(){
  var mx=0;gems.forEach(function(g){var m=(g.id||'').match(/(\d+)$/);if(m)mx=Math.max(mx,+m[1]);});
  return 'gem-'+pad(mx+1);
}

function updateBulkProgress(){
  var remaining=bulkQueue.length-bulkIndex;
  document.getElementById('bulk-progress').textContent=
    'Specimen '+(bulkIndex+1)+' of '+bulkQueue.length+' · '+bulkSaved+' saved · '+(remaining-1)+' remaining';
}

function openBulkStep(photoReady){
  if(bulkIndex>=bulkQueue.length){
    closeBulkModal();
    flashSaved();
    render(document.getElementById('search').value);
    return;
  }
  updateBulkProgress();
  document.getElementById('bf-name').value='';
  document.getElementById('bf-group').value=bulkLastMeta?bulkLastMeta.group:'';
  document.getElementById('bf-origin').value=bulkLastMeta?bulkLastMeta.origin:'';
  document.getElementById('bf-location').value=bulkLastMeta?bulkLastMeta.location:'';
  document.getElementById('bf-prov').value=bulkLastMeta?bulkLastMeta.prov:'';
  selectedBulkCabIds=bulkLastMeta?bulkLastMeta.cabinets.slice():[];
  fillGrps();
  renderBulkCabRows();
  document.getElementById('bulk-ferr').classList.remove('show');
  document.getElementById('bulk-modal').classList.add('open');
  var prev=document.getElementById('bulk-photo-prev');
  prev.src='';prev.style.display='block'; // reserve space immediately, avoids layout shift

  function showPhoto(dataURL){
    bulkPendingPhoto=dataURL;
    prev.src=dataURL;prev.style.display='block';
    // Pre-load the next photo in background while user fills form
    if(bulkIndex+1<bulkQueue.length && !bulkNextPhoto){
      processPhotoFile(bulkQueue[bulkIndex+1],function(d){bulkNextPhoto=d;});
    }
  }

  if(photoReady && bulkPendingPhoto){
    showPhoto(bulkPendingPhoto);
  } else if(bulkNextPhoto){
    // Already ready — instant transition
    showPhoto(bulkNextPhoto);
    bulkNextPhoto=null;
  } else {
    prev.style.display='none';
    processPhotoFile(bulkQueue[bulkIndex],function(dataURL){showPhoto(dataURL);});
  }
}

function renderBulkCabRows(){
  var wrap=document.getElementById('bf-cabinets-wrap');
  if(!cabinets.length){wrap.innerHTML='<div class="cab-check-empty">No cabinets yet — create one in the Cabinets tab.</div>';return;}
  var h='';
  cabinets.forEach(function(c){
    var on=selectedBulkCabIds.indexOf(c.id)>-1;
    h+='<button type="button" class="cab-check-row'+(on?' on':'')+'" data-cid="'+c.id+'"><span class="cab-check-box">'+(on?'✓':'')+'</span>'+e(c.name)+'</button>';
  });
  wrap.innerHTML=h;
  wrap.onclick=function(ev){
    var btn=ev.target.closest('.cab-check-row');
    if(!btn)return;
    var cid=parseInt(btn.getAttribute('data-cid'));
    var idx=selectedBulkCabIds.indexOf(cid);
    if(idx>-1)selectedBulkCabIds.splice(idx,1);else selectedBulkCabIds.push(cid);
    renderBulkCabRows();
  };
}

var bulkBusy=false;
function setBulkBusy(b){
  bulkBusy=b;
  var saveBtn=document.getElementById('bulk-save');
  var skipBtn=document.getElementById('bulk-skip');
  saveBtn.disabled=b;skipBtn.disabled=b;
  saveBtn.style.opacity=b?'0.5':'1';
  skipBtn.style.opacity=b?'0.5':'1';
  saveBtn.textContent=b?'Saving…':'Save & Next';
}

document.getElementById('bulk-skip').onclick=function(){
  if(bulkBusy)return;
  bulkIndex++;openBulkStep(false);
};
document.getElementById('bulk-cancel').onclick=function(){
  if(bulkBusy)return;
  if(confirm('Stop bulk import? '+bulkSaved+' specimens already saved will be kept.')){
    closeBulkModal();
    render(document.getElementById('search').value);
  }
};
document.getElementById('bulk-save').onclick=function(){
  if(bulkBusy)return;
  var nm=document.getElementById('bf-name').value.trim();
  if(!nm){
    var el=document.getElementById('bulk-ferr');el.textContent='Please enter a name.';el.classList.add('show');
    return;
  }
  setBulkBusy(true);
  try{
    var gr=document.getElementById('bf-group').value.trim();
    var or=document.getElementById('bf-origin').value.trim();
    var lo=document.getElementById('bf-location').value.trim();
    var pv=document.getElementById('bf-prov').value.trim();
    var cabIds=selectedBulkCabIds.slice();
    var id=bulkNextId();
    var gem={id:id,name:nm,group:gr||'Uncategorized',formula:'',origin:or,location:lo,prov:pv,notes:'',photo:bulkPendingPhoto?id:null,cabinets:cabIds};
    gems.push(gem);
    // Background DB write — never blocks UI
    try{
      var tx=db.transaction(['gems','imgs'],'readwrite');
      tx.objectStore('gems').put(gem);
      if(bulkPendingPhoto){imgs[id]=bulkPendingPhoto;tx.objectStore('imgs').put({id:id,data:bulkPendingPhoto});}
      tx.onerror=function(e){
        var err=(e.target&&e.target.error)||{};
        if(err.name==='QuotaExceededError'||(err.message||'').indexOf('quota')>-1){
          var fel=document.getElementById('bulk-ferr');
          fel.textContent='Storage full! '+bulkSaved+' specimens saved. Try skipping photos.';
          fel.classList.add('show');
        }
      };
      tx.oncomplete=function(){
        try{sessionStorage.setItem('bulkCheckpoint',JSON.stringify({saved:bulkSaved,total:bulkQueue.length,ts:Date.now()}));}catch(e){}
      };
    }catch(e){}
    bulkSaved++;
    bulkLastMeta={group:gr,origin:or,location:lo,prov:pv,cabinets:cabIds};
    bulkPendingPhoto=bulkNextPhoto||null;
    bulkNextPhoto=null;
    bulkIndex++;
    if(bulkIndex+1<bulkQueue.length&&!bulkNextPhoto){
      processPhotoFile(bulkQueue[bulkIndex+1],function(d){bulkNextPhoto=d;});
    }
  }finally{
    setBulkBusy(false);
  }
  openBulkStep(!!bulkPendingPhoto);
};

function closeBulkModal(){
  document.getElementById('bulk-modal').classList.remove('open');
  bulkQueue=[];bulkIndex=0;bulkPendingPhoto=null;bulkNextPhoto=null;bulkSaved=0;
  setBulkBusy(false);
  try{sessionStorage.removeItem('bulkCheckpoint');}catch(e){}
}

// ── DELETE ─────────────────────────────────────────────────────────────────
function openDel(id,type){
  delId=id;delType=type;
  var label=type==='gem'?(find(id)?find(id).name:id):(cabinets.find(function(c){return c.id===id;})||{name:id}).name;
  document.getElementById('del-gem-name').textContent=label;
  document.getElementById('del-note').textContent=type==='cab'?'This cabinet will be removed from all assigned gems.':'This cannot be undone.';
  document.getElementById('del-modal').classList.add('open');
}
document.getElementById('btn-del-no').onclick=function(){document.getElementById('del-modal').classList.remove('open');delId=null;};
document.getElementById('btn-del-yes').onclick=function(){
  if(delType==='gem'){
    deleteGemDB(delId,function(){
      gems=gems.filter(function(g){return g.id!==delId;});
      delete imgs[delId];delete rotated[delId];
      flashSaved();document.getElementById('del-modal').classList.remove('open');delId=null;
      render(document.getElementById('search').value);
    });
  } else if(delType==='cab'){
    deleteCabDB(delId,function(){
      cabinets=cabinets.filter(function(c){return c.id!==delId;});
      gems.forEach(function(g){
        var cabs=gemCabinets(g);
        var idx=cabs.indexOf(delId);
        if(idx>-1){cabs.splice(idx,1);g.cabinets=cabs;delete g.cabinet;persistGem(g);}
      });
      flashSaved();document.getElementById('del-modal').classList.remove('open');delId=null;
      renderCabinets();renderCabBar();render(document.getElementById('search').value);
    });
  }
};
document.getElementById('del-modal').onclick=function(ev){if(ev.target===this){this.classList.remove('open');delId=null;}};

// ── UTILS ──────────────────────────────────────────────────────────────────
function find(id){return gems.find(function(g){return g.id===id;})||null;}
function pad(n){var s=String(n);while(s.length<3)s='0'+s;return s;}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shErr(m){var el=document.getElementById('ferr');el.textContent=m;el.classList.add('show');}
function clrErr(){document.getElementById('ferr').classList.remove('show');}

// ── INIT ───────────────────────────────────────────────────────────────────
PURCHASES=parsePurchases();
setPurchStatus(PURCHASES.length+' purchases ready');
wirePurchaseSearch('f-purch-search','f-purch-results','single');
wirePurchaseSearch('bf-purch-search','bf-purch-results','bulk');
loadPurchasesLive();

openDB(function(){
  loadAll(function(){
    document.getElementById('db-status').textContent='';
    render('');
    // Check for interrupted bulk session
    try{
      var cp=sessionStorage.getItem('bulkCheckpoint');
      if(cp){
        var d=JSON.parse(cp);
        var mins=Math.round((Date.now()-d.ts)/60000);
        if(mins<120){
          var f=document.getElementById('saved-flash');
          f.textContent='Last bulk: '+d.saved+' of '+d.total+' saved — re-select photos to continue';
          f.classList.add('show');
          setTimeout(function(){f.textContent='✔ Saved';f.classList.remove('show');},6000);
        }
        sessionStorage.removeItem('bulkCheckpoint');
      }
    }catch(e){}
  });
});
