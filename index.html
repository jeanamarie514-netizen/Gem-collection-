<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>✦ Gem Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap');
:root{
  --teal1:#9ed8d4;--teal2:#b0e4e0;--teal3:#c4f0ec;
  --ink:#021212;--dark:#051818;--mid:#0d4444;--soft:#1a6060;
  --accent:#2a9090;--accent2:#40b8b0;--white:#fff;
  --glass:rgba(255,255,255,0.38);--glass2:rgba(255,255,255,0.6);
  --border:rgba(42,144,144,0.3);--border2:rgba(120,200,196,0.5);
  --red:#a03050;--redbg:rgba(255,210,210,0.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:#9ed8d4;}
html,body{color:var(--dark);font-family:'Crimson Pro',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body{background:linear-gradient(160deg,#9ed8d4 0%,#b0e4e0 30%,#c4f0ec 60%,#9ed4d0 100%);background-attachment:fixed;}

#bg{position:fixed;inset:0;pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 12px 100px;}

header{text-align:center;padding:36px 0 20px;}
header h1{font-family:'Cinzel',serif;font-size:clamp(1.5rem,5vw,2.6rem);font-weight:900;letter-spacing:.08em;background:linear-gradient(135deg,#1a6a60,#40b8a8,#0a8080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
header p{margin-top:5px;font-size:.88rem;font-style:italic;color:var(--mid);}
#gem-count{display:inline-block;margin-top:10px;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.14em;color:var(--soft);border:1px solid rgba(26,106,96,.4);border-radius:20px;padding:3px 13px;}

#nav-tabs{display:flex;gap:0;justify-content:center;margin:18px 0 0;border-bottom:1px solid var(--border2);}
.nav-tab{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.12em;padding:9px 18px;border:none;background:none;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.nav-tab:hover{color:var(--accent2);}

#toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 14px;}
.tb-btn{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.1em;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--glass);color:var(--dark);cursor:pointer;user-select:none;backdrop-filter:blur(6px);transition:all .2s;}
.tb-btn:hover{background:var(--glass2);border-color:var(--accent2);}
.tb-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent2);color:#fff;}
.tb-btn.primary:hover{opacity:.9;}
.tb-btn.active-view{background:var(--glass2);border-color:var(--accent);color:var(--accent);font-weight:600;}

#search-wrap{margin:0 0 14px;position:relative;}
#search{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:10px 14px 10px 36px;color:var(--dark);font-family:'Crimson Pro',serif;font-size:1rem;outline:none;backdrop-filter:blur(6px);}
#search::placeholder{color:rgba(10,50,50,.5);}
#search-wrap::before{content:'✦';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:.75rem;}

#cabinet-bar{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;margin-bottom:6px;scrollbar-width:none;}
#cabinet-bar::-webkit-scrollbar{display:none;}
.cab-chip{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.1em;padding:5px 12px;border-radius:14px;border:1px solid var(--border2);background:var(--glass);color:var(--mid);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s;}
.cab-chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent2);color:#fff;}

.group-hd{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.18em;color:var(--soft);padding:16px 4px 7px;border-bottom:1px solid rgba(26,106,96,.25);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.group-hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(26,106,96,.25),transparent);}

#view-grid{display:block;}
.gem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
@media(min-width:500px){.gem-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:720px){.gem-grid{grid-template-columns:repeat(4,1fr);}}
.gem-tile{background:var(--glass);border:1px solid var(--border2);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);transition:transform .2s,box-shadow .2s;}
.gem-tile:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(42,144,144,.15);}
.tile-img{position:relative;width:100%;aspect-ratio:1;overflow:hidden;background:rgba(160,220,216,0.25);cursor:pointer;}
.tile-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
.tile-img img.rot{transform:rotate(90deg) scale(1.35);}
.no-photo{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;background:radial-gradient(circle at 50% 60%,rgba(42,144,144,.12),transparent 70%);}
.rot-btn{position:absolute;bottom:5px;right:5px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--glass2);color:var(--mid);font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;user-select:none;}
.rot-btn.on{background:rgba(42,160,155,.8);border-color:var(--accent2);color:#fff;}
.cab-badge-wrap{position:absolute;top:5px;left:5px;right:34px;display:flex;flex-wrap:wrap;gap:3px;}
.cab-badge{font-family:'Cinzel',serif;font-size:.46rem;letter-spacing:.05em;background:rgba(42,144,144,.8);color:#fff;padding:2px 6px;border-radius:8px;backdrop-filter:blur(4px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tile-info{padding:7px 8px 8px;}
.tile-name{font-family:'Cinzel',serif;font-size:.64rem;font-weight:600;color:var(--ink);letter-spacing:.04em;line-height:1.3;margin-bottom:1px;}
.tile-sub{font-size:.7rem;font-style:italic;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-meta{font-family:'Cinzel',serif;font-size:.52rem;color:rgba(10,50,50,.55);margin-top:2px;}
.tile-acts{display:flex;gap:4px;margin-top:5px;}
.tile-act{flex:1;font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.05em;padding:5px 2px;border-radius:5px;border:1px solid var(--border);background:var(--glass);color:var(--mid);cursor:pointer;text-align:center;user-select:none;}
.tile-act.del{border-color:rgba(160,48,80,.3);background:var(--redbg);color:var(--red);}

#view-list{display:none;}
.list-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.list-table th{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;color:var(--soft);padding:8px 10px;border-bottom:1px solid var(--border2);text-align:left;background:var(--glass);position:sticky;top:0;backdrop-filter:blur(8px);}
.list-table td{padding:8px 10px;border-bottom:1px solid rgba(42,144,144,.12);vertical-align:middle;color:var(--dark);}
.list-table tr:hover td{background:rgba(255,255,255,.25);}
.list-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;display:block;cursor:pointer;}
.list-thumb-empty{width:36px;height:36px;border-radius:6px;background:rgba(42,144,144,.12);display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.list-name{font-family:'Cinzel',serif;font-size:.7rem;font-weight:600;color:var(--ink);letter-spacing:.03em;cursor:pointer;}
.list-name:hover{color:var(--accent);}
.list-cabchips{display:flex;flex-wrap:wrap;gap:3px;}
.list-cabchip{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.04em;background:rgba(42,144,144,.15);color:var(--soft);padding:2px 6px;border-radius:6px;white-space:nowrap;}
.list-acts{display:flex;gap:4px;}
.list-act{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.05em;padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--glass);color:var(--mid);cursor:pointer;}
.list-act.del{border-color:rgba(160,48,80,.3);background:var(--redbg);color:var(--red);}
.list-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border2);background:var(--glass);backdrop-filter:blur(8px);}

#view-cabinets{display:none;}
.cab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(min-width:500px){.cab-grid{grid-template-columns:repeat(3,1fr);}}
.cab-card{background:var(--glass);border:1px solid var(--border2);border-radius:12px;padding:14px;backdrop-filter:blur(8px);cursor:pointer;transition:all .2s;}
.cab-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(42,144,144,.15);}
.cab-icon{font-size:1.6rem;margin-bottom:6px;}
.cab-name{font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;color:var(--ink);letter-spacing:.04em;margin-bottom:2px;}
.cab-loc{font-size:.72rem;font-style:italic;color:var(--mid);}
.cab-count{font-family:'Cinzel',serif;font-size:.58rem;color:var(--soft);margin-top:6px;}
.cab-acts{display:flex;gap:4px;margin-top:8px;}
.cab-act{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.05em;padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--glass2);color:var(--mid);cursor:pointer;}
.cab-act.del{border-color:rgba(160,48,80,.3);background:var(--redbg);color:var(--red);}
.add-cab-card{background:rgba(42,144,144,.08);border:1px dashed var(--border2);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:100px;transition:all .2s;}
.add-cab-card:hover{background:rgba(42,144,144,.15);}
.add-cab-label{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;color:var(--soft);margin-top:4px;}

#lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(100,180,176,.4);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:16px;}
#lightbox.open{display:flex;}
#lb-inner{max-width:460px;width:100%;background:var(--glass2);border:1px solid var(--border2);border-radius:18px;overflow:hidden;position:relative;backdrop-filter:blur(14px);}
#lb-img-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;background:rgba(160,220,216,.2);}
#lb-img{width:100%;height:100%;object-fit:contain;display:block;}
#lb-img.rot{transform:rotate(90deg) scale(1.35);}
#lb-nophoto{width:100%;height:100%;display:none;align-items:center;justify-content:center;font-size:4rem;}
#lb-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--glass2);color:var(--mid);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;}
#lb-body{padding:14px 16px 18px;}
#lb-name{font-family:'Cinzel',serif;font-size:.95rem;font-weight:600;color:var(--ink);letter-spacing:.05em;margin-bottom:2px;}
#lb-meta{font-size:.78rem;font-style:italic;color:var(--soft);margin-bottom:10px;}
#lb-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:10px;}
.lb-field{display:flex;flex-direction:column;gap:1px;}
.lb-field.full{grid-column:1/-1;}
.lb-field-label{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.1em;color:var(--soft);}
.lb-field-val{font-size:.82rem;color:var(--dark);}
.lb-cabchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
.lb-cabchip{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.05em;background:rgba(42,144,144,.15);color:var(--soft);padding:3px 8px;border-radius:8px;}
#lb-notes{font-size:.83rem;line-height:1.6;color:var(--dark);border-top:1px solid var(--border);padding-top:8px;margin-top:4px;}
#lb-actions{display:flex;gap:8px;margin-top:10px;}
.lb-act{flex:1;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.08em;padding:9px;border-radius:8px;border:1px solid var(--border);background:var(--glass);color:var(--mid);cursor:pointer;text-align:center;}
.lb-act.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent2);color:#fff;}
.lb-act.del{border-color:rgba(160,48,80,.3);background:var(--redbg);color:var(--red);}

.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(100,180,176,.35);backdrop-filter:blur(8px);align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px 12px 40px;}
.modal.open{display:flex;}
.mbox{width:100%;max-width:460px;margin:auto;background:var(--glass2);border:1px solid var(--border2);border-radius:18px;padding:20px 18px 24px;backdrop-filter:blur(14px);}
.mbox h2{font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:.12em;color:var(--soft);margin-bottom:14px;text-align:center;}
.field{margin-bottom:10px;}
.field label{display:block;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.1em;color:var(--soft);margin-bottom:3px;}
.field input,.field textarea,.field select{width:100%;background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--ink);font-family:'Crimson Pro',serif;font-size:.92rem;outline:none;-webkit-appearance:none;}
.field select{cursor:pointer;}
.field textarea{resize:vertical;min-height:60px;line-height:1.5;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#photo-prev{width:100%;max-height:140px;object-fit:cover;border-radius:7px;border:1px solid var(--border);display:none;margin-top:6px;}
#ferr{display:none;background:var(--redbg);border:1px solid rgba(160,48,80,.4);border-radius:7px;padding:8px 11px;font-size:.82rem;color:#7a1830;margin-top:10px;line-height:1.5;}
#ferr.show{display:block;}
.form-acts{display:flex;gap:8px;margin-top:14px;}
.form-acts button{flex:1;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;padding:13px;border-radius:8px;border:none;cursor:pointer;user-select:none;min-height:46px;}
#btn-cancel{background:var(--glass);border:1px solid var(--border);color:var(--dark);}
#btn-save{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}

/* ── CABINET MULTI-SELECT CHECKBOXES ── */
#f-cabinets-wrap{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;background:rgba(255,255,255,.4);border:1px solid var(--border);border-radius:7px;padding:8px 10px;}
.cab-check-row{display:flex;align-items:center;gap:8px;font-family:'Crimson Pro',serif;font-size:.88rem;color:var(--ink);cursor:pointer;}
.cab-check-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.cab-check-empty{font-size:.82rem;font-style:italic;color:var(--mid);padding:4px 0;}

#cab-modal .mbox{max-width:360px;}
#cab-ferr{display:none;background:var(--redbg);border:1px solid rgba(160,48,80,.4);border-radius:7px;padding:8px 11px;font-size:.82rem;color:#7a1830;margin-top:10px;}
#cab-ferr.show{display:block;}
#cab-form-acts{display:flex;gap:8px;margin-top:14px;}
#cab-form-acts button{flex:1;font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.1em;padding:12px;border-radius:8px;cursor:pointer;min-height:44px;}
#cab-btn-cancel{background:var(--glass);border:1px solid var(--border);color:var(--dark);}
#cab-btn-save{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;}

#del-modal{z-index:300;}
#del-modal .mbox{max-width:300px;text-align:center;border-color:rgba(160,48,80,.4);}
#del-modal h2{color:var(--red);}
#del-gem-name{font-family:'Cinzel',serif;font-size:.88rem;color:var(--ink);margin-bottom:8px;}
#del-note{font-size:.82rem;font-style:italic;color:var(--mid);margin-bottom:16px;line-height:1.5;}
#del-acts{display:flex;gap:8px;}
#del-acts button{flex:1;font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.08em;padding:12px;border-radius:8px;cursor:pointer;min-height:44px;}
#btn-del-no{background:var(--glass);border:1px solid var(--border);color:var(--dark);}
#btn-del-yes{background:linear-gradient(135deg,#b02840,#d04060);border:none;color:#fff;}

#empty{display:none;text-align:center;padding:50px 20px;}
#empty p{font-size:.95rem;font-style:italic;color:var(--mid);}

#saved-flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(200,240,210,.95);border:1px solid #60b870;color:#1a4a28;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.1em;padding:8px 18px;border-radius:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#saved-flash.show{opacity:1;}
#db-status{text-align:center;font-size:.68rem;color:var(--soft);padding:4px;font-style:italic;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="saved-flash">✦ Saved</div>

<div id="app">
  <header>
    <h1>✦ Gem Gallery ✦</h1>
    <p>A family mineral &amp; crystal collection</p>
    <div id="gem-count">0 specimens</div>
  </header>

  <div id="nav-tabs">
    <button class="nav-tab active" data-tab="collection">Collection</button>
    <button class="nav-tab" data-tab="cabinets">Cabinets</button>
  </div>

  <div id="db-status">Loading…</div>

  <!-- COLLECTION TAB -->
  <div id="tab-collection">
    <div id="toolbar">
      <button class="tb-btn primary" id="btn-add">＋ Add Gem</button>
      <button class="tb-btn active-view" id="btn-grid-view">⊞ Grid</button>
      <button class="tb-btn" id="btn-list-view">≡ List</button>
    </div>
    <div id="search-wrap">
      <input id="search" type="text" placeholder="Search by name, mineral, origin…" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div id="cabinet-bar"></div>
    <div id="view-grid">
      <div id="gallery"></div>
      <div id="empty"><p>No gems yet — tap ＋ Add Gem to begin.</p></div>
    </div>
    <div id="view-list">
      <div class="list-wrap">
        <table class="list-table">
          <thead><tr>
            <th></th>
            <th>Name</th>
            <th>Mineral Group</th>
            <th>Country</th>
            <th>Provenance</th>
            <th>Cabinets</th>
            <th></th>
          </tr></thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CABINETS TAB -->
  <div id="tab-cabinets" style="display:none;padding-top:16px;">
    <div id="toolbar-cabs" style="display:flex;gap:8px;justify-content:center;margin-bottom:14px;">
      <button class="tb-btn primary" id="btn-add-cab">＋ New Cabinet</button>
    </div>
    <div id="cab-grid-wrap"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div id="lb-inner">
    <div id="lb-img-wrap">
      <img id="lb-img" src="" alt="">
      <div id="lb-nophoto">💎</div>
    </div>
    <button id="lb-close">✕</button>
    <div id="lb-body">
      <div id="lb-name"></div>
      <div id="lb-meta"></div>
      <div id="lb-fields"></div>
      <div id="lb-notes"></div>
      <div id="lb-actions"></div>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div id="add-modal" class="modal">
  <div class="mbox">
    <h2 id="form-title">✦ ADD NEW GEM ✦</h2>
    <div class="field"><label>GEM ID</label><input id="f-id" type="text" placeholder="gem-001"></div>
    <div class="field"><label>NAME</label><input id="f-name" type="text" placeholder="Amethyst Cluster"></div>
    <div class="field-row">
      <div class="field"><label>MINERAL GROUP</label><input id="f-group" type="text" placeholder="Quartz" list="grp-list"><datalist id="grp-list"></datalist></div>
      <div class="field"><label>CHEMICAL FORMULA</label><input id="f-formula" type="text" placeholder="SiO₂"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>COUNTRY</label><input id="f-origin" type="text" placeholder="Brazil"></div>
      <div class="field"><label>LOCATION / MINE</label><input id="f-location" type="text" placeholder="Minas Gerais"></div>
    </div>
    <div class="field"><label>PROVENANCE (from whom)</label><input id="f-prov" type="text" placeholder="Purchased at Tucson Gem Show 2024"></div>
    <div class="field"><label>CABINETS (select any that apply)</label>
      <div id="f-cabinets-wrap"></div>
    </div>
    <div class="field"><label>NOTES</label><textarea id="f-notes" placeholder="Description, size, characteristics…"></textarea></div>
    <div class="field"><label>PHOTO</label><input id="f-photo" type="file" accept="image/*"><img id="photo-prev" alt="preview"></div>
    <div id="ferr"></div>
    <div class="form-acts">
      <button id="btn-cancel">Cancel</button>
      <button id="btn-save">Add to Collection</button>
    </div>
  </div>
</div>

<!-- CABINET MODAL -->
<div id="cab-modal" class="modal">
  <div class="mbox">

  <div class="mbox">
    <h2>REMOVE?</h2>

    <div id="del-note">This cannot be undone.</div>

<script>
// ── IndexedDB ──────────────────────────────────────────────────────────────
var DB_NAME='GemGallery', DB_VER=2, db=null;
var gems=[], imgs={}, cabinets=[], rotated={};
var editId=null, delId=null, delType=null, pendingPhoto=null, editCabId=null;
var currentView='grid', currentTab='collection', filterCabinet='all';

function openDB(cb){
  var req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=function(e){
    var d=e.target.result;
    if(!d.objectStoreNames.contains('gems')) d.createObjectStore('gems',{keyPath:'id'});
    if(!d.objectStoreNames.contains('imgs')) d.createObjectStore('imgs',{keyPath:'id'});
    if(!d.objectStoreNames.contains('cabinets')) d.createObjectStore('cabinets',{keyPath:'id',autoIncrement:true});
  };
  req.onsuccess=function(e){db=e.target.result;cb();};
  req.onerror=function(){document.getElementById('db-status').textContent='';render('');};
}

function loadAll(cb){
  var tx=db.transaction(['gems','imgs','cabinets'],'readonly');
  var gr=tx.objectStore('gems').getAll();
  var ir=tx.objectStore('imgs').getAll();
  var cr=tx.objectStore('cabinets').getAll();
  var done=0;
  function chk(){if(++done===3)cb();}
  gr.onsuccess=function(){
    gems=gr.result||[];
    // migrate legacy single 'cabinet' field to 'cabinets' array
    gems.forEach(function(g){
      if(g.cabinets===undefined){
        g.cabinets = g.cabinet ? [g.cabinet] : [];
      }
    });
    chk();
  };
  ir.onsuccess=function(){imgs={};(ir.result||[]).forEach(function(r){imgs[r.id]=r.data;});chk();};
  cr.onsuccess=function(){cabinets=cr.result||[];chk();};
}

function persistGem(g,cb){var tx=db.transaction('gems','readwrite');tx.objectStore('gems').put(g);tx.oncomplete=function(){if(cb)cb();};}
function persistImg(id,data,cb){var tx=db.transaction('imgs','readwrite');tx.objectStore('imgs').put({id:id,data:data});tx.oncomplete=function(){if(cb)cb();};}
function persistCab(c,cb){var tx=db.transaction('cabinets','readwrite');var req=tx.objectStore('cabinets').put(c);req.onsuccess=function(){if(!c.id)c.id=req.result;};tx.oncomplete=function(){if(cb)cb();};}
function deleteGemDB(id,cb){var tx=db.transaction(['gems','imgs'],'readwrite');tx.objectStore('gems').delete(id);tx.objectStore('imgs').delete(id);tx.oncomplete=function(){if(cb)cb();};}
function deleteCabDB(id,cb){var tx=db.transaction('cabinets','readwrite');tx.objectStore('cabinets').delete(id);tx.oncomplete=function(){if(cb)cb();};}

function flashSaved(){
  var f=document.getElementById('saved-flash');f.classList.add('show');
  clearTimeout(flashSaved._t);flashSaved._t=setTimeout(function(){f.classList.remove('show');},1600);
}

// ── Glitter Stars ──────────────────────────────────────────────────────────
(function(){
  var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,stars=[];
  var COLORS=['#ffffff','#80d8d0','#40b0a8','#a0e8e4','#c0f4f0','#60c8c0','#e0f8f6','#90d4d0','#b0ece8'];
  function sz(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  sz();window.addEventListener('resize',function(){sz();mkStars();});
  function mkStars(){stars=[];for(var i=0;i<280;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+0.6,speed:Math.random()*.003+.001,phase:Math.random()*Math.PI*2,color:COLORS[Math.floor(Math.random()*COLORS.length)],sparkle:Math.random()>.55});}
  mkStars();
  function dsp(ctx,sx,sy,r,alpha,col){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=r*.6;ctx.beginPath();for(var i=0;i<4;i++){var a=(i/4)*Math.PI*2;ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*r*2.5,sy+Math.sin(a)*r*2.5);}ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx,sy,r*.5,0,Math.PI*2);ctx.fill();ctx.restore();}
  var t=0;
  (function draw(){x.clearRect(0,0,W,H);t+=1;for(var i=0;i<stars.length;i++){var s=stars[i];var alpha=.3+.7*Math.abs(Math.sin(t*s.speed+s.phase));if(s.sparkle)dsp(x,s.x,s.y,s.r,alpha*.9,s.color);else{x.save();x.globalAlpha=alpha;x.fillStyle=s.color;x.shadowColor=s.color;x.shadowBlur=s.r*3;x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();x.restore();}}requestAnimationFrame(draw);})();
})();

// ── Nav Tabs ───────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-tab').forEach(function(btn){
  btn.onclick=function(){
    currentTab=this.getAttribute('data-tab');
    document.querySelectorAll('.nav-tab').forEach(function(b){b.classList.remove('active');});
    this.classList.add('active');
    document.getElementById('tab-collection').style.display=currentTab==='collection'?'':'none';
    document.getElementById('tab-cabinets').style.display=currentTab==='cabinets'?'':'none';
    if(currentTab==='cabinets')renderCabinets();
  };
});

// ── View Toggle ────────────────────────────────────────────────────────────
document.getElementById('btn-grid-view').onclick=function(){
  currentView='grid';
  document.getElementById('view-grid').style.display='block';
  document.getElementById('view-list').style.display='none';
  this.classList.add('active-view');
  document.getElementById('btn-list-view').classList.remove('active-view');
};
document.getElementById('btn-list-view').onclick=function(){
  currentView='list';
  document.getElementById('view-grid').style.display='none';
  document.getElementById('view-list').style.display='block';
  this.classList.add('active-view');
  document.getElementById('btn-grid-view').classList.remove('active-view');
  renderList(document.getElementById('search').value);
};

// ── Cabinet Filter Bar ─────────────────────────────────────────────────────
function renderCabBar(){
  var bar=document.getElementById('cabinet-bar');
  var chips='<button class="cab-chip'+(filterCabinet==='all'?' active':'')+'" data-cab="all">All</button>';
  chips+='<button class="cab-chip'+(filterCabinet==='none'?' active':'')+'" data-cab="none">Unassigned</button>';
  cabinets.forEach(function(c){
    chips+='<button class="cab-chip'+(filterCabinet==c.id?' active':'')+'" data-cab="'+c.id+'">'+e(c.name)+'</button>';
  });
  bar.innerHTML=chips;
  bar.onclick=function(ev){
    var chip=ev.target.closest('.cab-chip');
    if(!chip)return;
    filterCabinet=chip.getAttribute('data-cab');
    if(filterCabinet!=='all'&&filterCabinet!=='none')filterCabinet=parseInt(filterCabinet);
    renderCabBar();
    render(document.getElementById('search').value);
  };
}

function gemCabinets(g){
  // returns array of cabinet ids for a gem (handles legacy + new)
  if(Array.isArray(g.cabinets))return g.cabinets;
  if(g.cabinet)return [g.cabinet];
  return [];
}

function getCabName(id){
  var c=cabinets.find(function(x){return x.id===id;});
  return c?c.name:'';
}

function getCabNames(g){
  return gemCabinets(g).map(getCabName).filter(Boolean);
}

// ── Filter gems ────────────────────────────────────────────────────────────
function filterGems(q){
  var list=gems.slice();
  if(q){var ql=q.toLowerCase();list=list.filter(function(g){return (g.name+' '+g.group+' '+g.origin+' '+g.notes+' '+g.id+' '+(g.formula||'')+' '+(g.prov||'')+' '+(g.location||'')).toLowerCase().indexOf(ql)>-1;});}
  if(filterCabinet==='none') list=list.filter(function(g){return gemCabinets(g).length===0;});
  else if(filterCabinet!=='all') list=list.filter(function(g){return gemCabinets(g).indexOf(filterCabinet)>-1;});
  return list;
}

// ── GRID RENDER ────────────────────────────────────────────────────────────
function render(q){
  q=(q||'').trim();
  document.getElementById('gem-count').textContent=gems.length+' specimen'+(gems.length!==1?'s':'');
  renderCabBar();
  var list=filterGems(q);
  var gal=document.getElementById('gallery');
  var emp=document.getElementById('empty');
  if(!list.length){gal.innerHTML='';emp.style.display='block';return;}
  emp.style.display='none';
  var grps={};
  list.forEach(function(g){var k=g.group||'Uncategorized';if(!grps[k])grps[k]=[];grps[k].push(g);});
  var keys=Object.keys(grps).sort(function(a,b){return a.localeCompare(b);});
  var h='';
  keys.forEach(function(k){
    h+='<div class="group-hd">'+e(k)+'</div><div class="gem-grid">';
    grps[k].forEach(function(g){
      var hi=!!(g.photo&&imgs[g.photo]),ro=rotated[g.id]?' rot':'';
      var cabNames=getCabNames(g);
      h+='<div class="gem-tile"><div class="tile-img" data-id="'+e(g.id)+'">';
      h+=hi?'<img class="tile-photo'+ro+'" src="'+imgs[g.photo]+'" loading="lazy">':'<div class="no-photo">💎</div>';
      if(cabNames.length){
        h+='<div class="cab-badge-wrap">'+cabNames.map(function(n){return '<div class="cab-badge">'+e(n)+'</div>';}).join('')+'</div>';
      }
      h+='<button class="rot-btn'+(rotated[g.id]?' on':'')+'" data-rid="'+e(g.id)+'">↻</button>';
      h+='</div><div class="tile-info"><div class="tile-name">'+e(g.name||'')+'</div>';
      h+='<div class="tile-sub">'+e(g.origin||'')+(g.formula?' · '+e(g.formula):'')+'</div>';
      h+='<div class="tile-meta">'+e(g.id||'')+'</div>';
      h+='<div class="tile-acts"><button class="tile-act ebt" data-eid="'+e(g.id)+'">✎ Edit</button><button class="tile-act del dbt" data-did="'+e(g.id)+'">✕ Del</button></div>';
      h+='</div></div>';
    });
    h+='</div>';
  });
  gal.innerHTML=h;
  gal.onclick=function(ev){
    var t=ev.target;
    if(t.classList.contains('rot-btn')){ev.stopPropagation();doRot(t.getAttribute('data-rid'));return;}
    if(t.classList.contains('ebt')){ev.stopPropagation();openEdit(t.getAttribute('data-eid'));return;}
    if(t.classList.contains('dbt')){ev.stopPropagation();openDel(t.getAttribute('data-did'),'gem');return;}
    var wrap=t.closest?t.closest('.tile-img'):null;
    if(wrap)openLB(wrap.getAttribute('data-id'));
  };
  if(currentView==='list')renderList(q);
}

// ── LIST RENDER ────────────────────────────────────────────────────────────
function renderList(q){
  var list=filterGems((q||'').trim());
  var h='';
  list.forEach(function(g){
    var hi=!!(g.photo&&imgs[g.photo]);
    var thumb=hi?'<img class="list-thumb lbt" src="'+imgs[g.photo]+'" data-id="'+e(g.id)+'" loading="lazy">':'<div class="list-thumb-empty">💎</div>';
    var cabNames=getCabNames(g);
    var cabHtml=cabNames.length?'<div class="list-cabchips">'+cabNames.map(function(n){return '<span class="list-cabchip">'+e(n)+'</span>';}).join('')+'</div>':'';
    h+='<tr>';
    h+='<td>'+thumb+'</td>';
    h+='<td><div class="list-name lbn" data-id="'+e(g.id)+'">'+e(g.name||'')+'</div><div style="font-size:.65rem;color:#1a6060;font-style:italic;">'+e(g.id||'')+'</div></td>';
    h+='<td>'+e(g.group||'')+(g.formula?'<br><span style="font-size:.7rem;font-style:italic;color:#0d4444;">'+e(g.formula)+'</span>':'')+'</td>';
    h+='<td>'+e(g.origin||'')+(g.location?'<br><span style="font-size:.7rem;font-style:italic;color:#0d4444;">'+e(g.location)+'</span>':'')+'</td>';
    h+='<td style="font-size:.78rem;font-style:italic;color:#0d4444;">'+e(g.prov||'')+'</td>';
    h+='<td style="font-size:.72rem;">'+cabHtml+'</td>';
    h+='<td><div class="list-acts"><button class="list-act lebt" data-eid="'+e(g.id)+'">Edit</button><button class="list-act del ldbt" data-did="'+e(g.id)+'">Del</button></div></td>';
    h+='</tr>';
  });
  document.getElementById('list-body').innerHTML=h;
  document.getElementById('list-body').onclick=function(ev){
    var t=ev.target;
    if(t.classList.contains('lebt')){ev.stopPropagation();openEdit(t.getAttribute('data-eid'));return;}
    if(t.classList.contains('ldbt')){ev.stopPropagation();openDel(t.getAttribute('data-did'),'gem');return;}
    if(t.classList.contains('lbt')||t.classList.contains('lbn')){openLB(t.getAttribute('data-id'));return;}
  };
}

// ── CABINETS RENDER ────────────────────────────────────────────────────────
function renderCabinets(){
  var wrap=document.getElementById('cab-grid-wrap');
  var h='<div class="cab-grid">';
  cabinets.forEach(function(c){
    var cnt=gems.filter(function(g){return gemCabinets(g).indexOf(c.id)>-1;}).length;
    h+='<div class="cab-card">';
    h+='<div class="cab-icon">🗄️</div>';
    h+='<div class="cab-name">'+e(c.name)+'</div>';
    if(c.location)h+='<div class="cab-loc">'+e(c.location)+'</div>';
    if(c.desc)h+='<div class="cab-loc" style="font-style:normal;font-size:.68rem;color:#1a6060;margin-top:2px;">'+e(c.desc)+'</div>';
    h+='<div class="cab-count">'+cnt+' specimen'+(cnt!==1?'s':'')+'</div>';
    h+='<div class="cab-acts"><button class="cab-act cebt" data-cid="'+c.id+'">✎ Edit</button><button class="cab-act del cdbt" data-cid="'+c.id+'">✕ Remove</button></div>';
    h+='</div>';
  });
  h+='<div class="add-cab-card" id="inline-add-cab"><div style="font-size:1.5rem;">＋</div><div class="add-cab-label">New Cabinet</div></div>';
  h+='</div>';
  wrap.innerHTML=h;
  wrap.onclick=function(ev){
    var t=ev.target;
    var cebt=t.closest?t.closest('.cebt'):null;
    var cdbt=t.closest?t.closest('.cdbt'):null;
    if(cebt){openEditCab(parseInt(cebt.getAttribute('data-cid')));return;}
    if(cdbt){openDel(parseInt(cdbt.getAttribute('data-cid')),'cab');return;}
    if(t.closest&&t.closest('#inline-add-cab'))openAddCab();
  };
}

function doRot(id){
  rotated[id]=!rotated[id];
  var img=document.querySelector('.tile-img[data-id="'+id+'"] .tile-photo');
  var btn=document.querySelector('.rot-btn[data-rid="'+id+'"]');
  if(img){rotated[id]?img.classList.add('rot'):img.classList.remove('rot');}
  if(btn){rotated[id]?btn.classList.add('on'):btn.classList.remove('on');}
}

// ── LIGHTBOX ───────────────────────────────────────────────────────────────
function openLB(id){
  var g=find(id);if(!g)return;
  var hi=!!(g.photo&&imgs[g.photo]);
  var li=document.getElementById('lb-img'),ln=document.getElementById('lb-nophoto');
  if(hi){li.src=imgs[g.photo];li.style.display='block';ln.style.display='none';rotated[id]?li.classList.add('rot'):li.classList.remove('rot');}
  else{li.style.display='none';ln.style.display='flex';}
  document.getElementById('lb-name').textContent=g.name||'';
  var meta=(g.group||'')+(g.formula?' · '+g.formula:'');
  document.getElementById('lb-meta').textContent=meta;
  var fields=[];
  if(g.origin||g.location) fields.push({l:'Origin',v:(g.origin||'')+(g.location?' — '+g.location:'')});
  if(g.prov) fields.push({l:'Provenance',v:g.prov});
  if(g.id) fields.push({l:'ID',v:g.id});
  var fh=fields.map(function(f){return '<div class="lb-field"><div class="lb-field-label">'+e(f.l)+'</div><div class="lb-field-val">'+e(f.v)+'</div></div>';}).join('');
  var cabNames=getCabNames(g);
  if(cabNames.length){
    fh+='<div class="lb-field full"><div class="lb-field-label">Cabinets</div><div class="lb-cabchips">'+cabNames.map(function(n){return '<span class="lb-cabchip">'+e(n)+'</span>';}).join('')+'</div></div>';
  }
  document.getElementById('lb-fields').innerHTML=fh;
  document.getElementById('lb-notes').innerHTML=g.notes?e(g.notes):'';
  document.getElementById('lb-notes').style.display=g.notes?'block':'none';
  document.getElementById('lb-actions').innerHTML=
    '<button class="lb-act primary lbedit" data-id="'+e(id)+'">✎ Edit</button>'+
    '<button class="lb-act del lbdel" data-id="'+e(id)+'">✕ Delete</button>';
  document.getElementById('lb-actions').onclick=function(ev){
    var t=ev.target;
    if(t.classList.contains('lbedit')){closeLB();openEdit(t.getAttribute('data-id'));return;}
    if(t.classList.contains('lbdel')){closeLB();openDel(t.getAttribute('data-id'),'gem');return;}
  };
  document.getElementById('lightbox').classList.add('open');
}
function closeLB(){document.getElementById('lightbox').classList.remove('open');}
document.getElementById('lb-close').onclick=closeLB;
document.getElementById('lightbox').onclick=function(ev){if(ev.target===this)closeLB();};

// ── SEARCH ─────────────────────────────────────────────────────────────────
document.getElementById('search').oninput=function(){
  render(this.value);
  if(currentView==='list')renderList(this.value);
};

// ── ADD/EDIT GEM ────────────────────────────────────────────────────────────
document.getElementById('btn-add').onclick=function(){openAdd();};
document.getElementById('btn-cancel').onclick=function(){closeAdd();};
document.getElementById('btn-save').onclick=function(){trySave();};
document.getElementById('add-modal').onclick=function(ev){if(ev.target===this)closeAdd();};

document.getElementById('f-photo').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var MAX=1200,q=0.82,w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      pendingPhoto=cv.toDataURL('image/jpeg',q);
      var p=document.getElementById('photo-prev');p.src=pendingPhoto;p.style.display='block';
    };
    img.onerror=function(){pendingPhoto=ev.target.result;};
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
};

function fillCabCheckboxes(selectedIds){
  var wrap=document.getElementById('f-cabinets-wrap');
  selectedIds=selectedIds||[];
  if(!cabinets.length){
    wrap.innerHTML='<div class="cab-check-empty">No cabinets yet — create one in the Cabinets tab.</div>';
    return;
  }
  var h='';
  cabinets.forEach(function(c){
    var checked=selectedIds.indexOf(c.id)>-1?' checked':'';
    h+='<label class="cab-check-row"><input type="checkbox" class="cab-check" value="'+c.id+'"'+checked+'>'+e(c.name)+'</label>';
  });
  wrap.innerHTML=h;
}

function getSelectedCabinets(){
  var boxes=document.querySelectorAll('.cab-check:checked');
  return Array.prototype.map.call(boxes,function(b){return parseInt(b.value);});
}

function openAdd(){
  editId=null;pendingPhoto=null;
  document.getElementById('form-title').textContent='✦ ADD NEW GEM ✦';
  document.getElementById('btn-save').textContent='Add to Collection';
  document.getElementById('f-id').readOnly=false;document.getElementById('f-id').style.opacity='1';
  var mx=0;gems.forEach(function(g){var m=(g.id||'').match(/(\d+)$/);if(m)mx=Math.max(mx,+m[1]);});
  document.getElementById('f-id').value='gem-'+pad(mx+1);
  ['f-name','f-group','f-formula','f-origin','f-location','f-prov','f-notes'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-photo').value='';
  document.getElementById('photo-prev').style.display='none';
  fillGrps();fillCabCheckboxes([]);clrErr();
  document.getElementById('add-modal').classList.add('open');
}

function openEdit(id){
  var g=find(id);if(!g)return;
  editId=id;pendingPhoto=null;
  document.getElementById('form-title').textContent='✦ EDIT GEM ✦';
  document.getElementById('btn-save').textContent='Save Changes';
  document.getElementById('f-id').value=g.id;document.getElementById('f-id').readOnly=true;document.getElementById('f-id').style.opacity='.5';
  document.getElementById('f-name').value=g.name||'';
  document.getElementById('f-group').value=g.group||'';
  document.getElementById('f-formula').value=g.formula||'';
  document.getElementById('f-origin').value=g.origin||'';
  document.getElementById('f-location').value=g.location||'';
  document.getElementById('f-prov').value=g.prov||'';
  document.getElementById('f-notes').value=g.notes||'';
  document.getElementById('f-photo').value='';
  var p=document.getElementById('photo-prev'),xi=g.photo?imgs[g.photo]:null;
  if(xi){p.src=xi;p.style.display='block';}else{p.style.display='none';}
  fillGrps();fillCabCheckboxes(gemCabinets(g));clrErr();
  document.getElementById('add-modal').classList.add('open');
}

function closeAdd(){document.getElementById('add-modal').classList.remove('open');editId=null;}

function fillGrps(){
  var g={};gems.forEach(function(x){if(x.group)g[x.group]=1;});
  document.getElementById('grp-list').innerHTML=Object.keys(g).sort().map(function(k){return '<option value="'+e(k)+'">';}).join('');
}

function trySave(){
  clrErr();
  var id=document.getElementById('f-id').value.trim();
  var nm=document.getElementById('f-name').value.trim();
  var gr=document.getElementById('f-group').value.trim();
  var fo=document.getElementById('f-formula').value.trim();
  var or=document.getElementById('f-origin').value.trim();
  var lo=document.getElementById('f-location').value.trim();
  var pv=document.getElementById('f-prov').value.trim();
  var nt=document.getElementById('f-notes').value.trim();
  var cabIds=getSelectedCabinets();
  if(!nm){shErr('Please enter a name.');return;}
  if(editId){
    var i=gems.findIndex(function(x){return x.id===editId;});
    if(i<0){shErr('Gem not found.');return;}
    gems[i].name=nm;gems[i].group=gr||'Uncategorized';gems[i].formula=fo;
    gems[i].origin=or;gems[i].location=lo;gems[i].prov=pv;gems[i].notes=nt;
    gems[i].cabinets=cabIds;
    delete gems[i].cabinet; // drop legacy field
    persistGem(gems[i]);
    if(pendingPhoto){imgs[editId]=pendingPhoto;gems[i].photo=editId;persistImg(editId,pendingPhoto);persistGem(gems[i]);}
    flashSaved();document.getElementById('btn-save').textContent='✓ Saved!';
    setTimeout(function(){closeAdd();render(document.getElementById('search').value);},500);
    return;
  }
  if(!id){shErr('Please enter a Gem ID.');return;}
  if(find(id)){shErr('ID "'+id+'" already exists.');return;}
  var gem={id:id,name:nm,group:gr||'Uncategorized',formula:fo,origin:or,location:lo,prov:pv,notes:nt,photo:pendingPhoto?id:null,cabinets:cabIds};
  gems.push(gem);persistGem(gem);
  if(pendingPhoto){imgs[id]=pendingPhoto;persistImg(id,pendingPhoto);}
  flashSaved();document.getElementById('btn-save').textContent='✓ Added!';
  setTimeout(function(){closeAdd();render(document.getElementById('search').value);},500);
}

// ── CABINETS CRUD ──────────────────────────────────────────────────────────
document.getElementById('btn-add-cab').onclick=openAddCab;
document.getElementById('cab-btn-cancel').onclick=function(){document.getElementById('cab-modal').classList.remove('open');editCabId=null;};
document.getElementById('cab-modal').onclick=function(ev){if(ev.target===this){this.classList.remove('open');editCabId=null;}};
document.getElementById('cab-btn-save').onclick=trySaveCab;

function openAddCab(){
  editCabId=null;
  document.getElementById('cab-form-title').textContent='✦ NEW CABINET ✦';
  document.getElementById('cab-btn-save').textContent='Create Cabinet';
  ['cf-name','cf-loc','cf-desc'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('cab-ferr').classList.remove('show');
  document.getElementById('cab-modal').classList.add('open');
}

function openEditCab(id){
  var c=cabinets.find(function(x){return x.id===id;});if(!c)return;
  editCabId=id;
  document.getElementById('cab-form-title').textContent='✦ EDIT CABINET ✦';
  document.getElementById('cab-btn-save').textContent='Save Changes';
  document.getElementById('cf-name').value=c.name||'';
  document.getElementById('cf-loc').value=c.location||'';
  document.getElementById('cf-desc').value=c.desc||'';
  document.getElementById('cab-ferr').classList.remove('show');
  document.getElementById('cab-modal').classList.add('open');
}

function trySaveCab(){
  var nm=document.getElementById('cf-name').value.trim();
  if(!nm){document.getElementById('cab-ferr').textContent='Please enter a cabinet name.';document.getElementById('cab-ferr').classList.add('show');return;}
  var lo=document.getElementById('cf-loc').value.trim();
  var ds=document.getElementById('cf-desc').value.trim();
  if(editCabId){
    var i=cabinets.findIndex(function(x){return x.id===editCabId;});
    if(i>=0){cabinets[i].name=nm;cabinets[i].location=lo;cabinets[i].desc=ds;persistCab(cabinets[i]);}
  } else {
    var nc={name:nm,location:lo,desc:ds};
    cabinets.push(nc);
    persistCab(nc,function(){});
  }
  flashSaved();document.getElementById('cab-modal').classList.remove('open');editCabId=null;
  setTimeout(function(){renderCabinets();renderCabBar();},200);
}

// ── DELETE ─────────────────────────────────────────────────────────────────
function openDel(id,type){
  delId=id;delType=type;
  var label=type==='gem'?(find(id)?find(id).name:id):(cabinets.find(function(c){return c.id===id;})||{name:id}).name;
  document.getElementById('del-gem-name').textContent=label;
  document.getElementById('del-note').textContent=type==='cab'?'This cabinet will be removed from all assigned gems.':'This cannot be undone.';
  document.getElementById('del-modal').classList.add('open');
}
document.getElementById('btn-del-no').onclick=function(){document.getElementById('del-modal').classList.remove('open');delId=null;};
document.getElementById('btn-del-yes').onclick=function(){
  if(delType==='gem'){
    deleteGemDB(delId,function(){
      gems=gems.filter(function(g){return g.id!==delId;});
      delete imgs[delId];delete rotated[delId];
      flashSaved();document.getElementById('del-modal').classList.remove('open');delId=null;
      render(document.getElementById('search').value);
    });
  } else if(delType==='cab'){
    deleteCabDB(delId,function(){
      cabinets=cabinets.filter(function(c){return c.id!==delId;});
      gems.forEach(function(g){
        var cabs=gemCabinets(g);
        var idx=cabs.indexOf(delId);
        if(idx>-1){cabs.splice(idx,1);g.cabinets=cabs;delete g.cabinet;persistGem(g);}
      });
      flashSaved();document.getElementById('del-modal').classList.remove('open');delId=null;
      renderCabinets();renderCabBar();render(document.getElementById('search').value);
    });
  }
};
document.getElementById('del-modal').onclick=function(ev){if(ev.target===this){this.classList.remove('open');delId=null;}};

// ── UTILS ──────────────────────────────────────────────────────────────────
function find(id){return gems.find(function(g){return g.id===id;})||null;}
function pad(n){var s=String(n);while(s.length<3)s='0'+s;return s;}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shErr(m){var el=document.getElementById('ferr');el.textContent=m;el.classList.add('show');}
function clrErr(){document.getElementById('ferr').classList.remove('show');}

// ── INIT ───────────────────────────────────────────────────────────────────
openDB(function(){
  loadAll(function(){
    document.getElementById('db-status').textContent='';
    render('');
  });
});
</script>
